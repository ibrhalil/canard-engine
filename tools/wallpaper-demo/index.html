<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Canard Wallpaper Demo</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c');
const x = c.getContext('2d');
let t = 0;
function resize() {
  c.width = innerWidth * devicePixelRatio;
  c.height = innerHeight * devicePixelRatio;
  x.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
}
addEventListener('resize', resize);
resize();
(function loop() {
  t += 0.016;
  const w = innerWidth, h = innerHeight;
  const g = x.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, `hsl(${(t * 20) % 360} 70% 12%)`);
  g.addColorStop(1, `hsl(${(t * 20 + 120) % 360} 70% 25%)`);
  x.fillStyle = g;
  x.fillRect(0, 0, w, h);
  for (let i = 0; i < 5; i++) {
    const r = 80 + i * 50 + Math.sin(t + i) * 30;
    x.beginPath();
    x.arc(w / 2 + Math.sin(t * 0.5 + i) * w * 0.25,
          h / 2 + Math.cos(t * 0.4 + i * 1.3) * h * 0.25, r, 0, 7);
    x.strokeStyle = `hsla(${(t * 40 + i * 60) % 360} 90% 65% / .5)`;
    x.lineWidth = 2;
    x.stroke();
  }
  x.fillStyle = 'rgba(255,255,255,.9)';
  x.font = '600 72px system-ui';
  x.textAlign = 'center';
  x.fillText(new Date().toLocaleTimeString('tr-TR'), w / 2, h / 2 + 24);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
